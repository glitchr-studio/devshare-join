# The DevShare demo service: ping/pong, served by server.mjs (make up) on port 47103 of this Mac.
title = "DevShare demo service"
kind = "service"

[environments.devshare-service]
title = "Service"
description = "A ping/pong service: type ping in its terminal, it answers pong."
services = [
  { host = "devshare-service.local", port = 80, target = "127.0.0.1:47103" },
]
